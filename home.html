<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="home.css" />
  </head>
  <body>
    <div class="game-container">
      <h1>🎮 Rock Paper Scissors</h1>
      <div id="rm">
        <h5 id="result-message"></h5>
      </div>
      
      <!-- Score Board -->
      <div class="score-board">
        <div class="score-box">
          <h3>🏆 Wins</h3>
          <p id="win-score">0</p>
        </div>

        <div class="score-box">
          <h3>🤝 Ties</h3>
          <p id="tie-score">0</p>
        </div>

        <div class="score-box">
          <h3>❌ Losses</h3>
          <p id="lose-score">0</p>
        </div>
      </div>

      <div class="buttons">
        <button class="btn rock" onclick="resulting('Rock')">✊ Rock</button>
        <button class="btn paper" onclick="resulting('Paper')">✋ Paper</button>
        <button class="btn scissors" onclick="resulting('Scissors')">
          ✌️ Scissors
        </button>
      </div>

      <button class="reset-btn" onclick="reset()">🔄 Reset Score</button>
    </div>
    <script src="home.js"></script>
  </body>
</html>
