<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .game-container {
        background: white;
        padding: 40px;
        border-radius: 20px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        width: 450px;
      }

      h1 {
        color: #333;
        margin-bottom: 30px;
      }

      .buttons {
        display: flex;
        justify-content: center;
        gap: 15px;
        margin-bottom: 25px;
      }

      .btn {
        padding: 15px 20px;
        border: none;
        border-radius: 12px;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }

      .rock {
        background-color: #ff6b6b;
        color: white;
      }

      .paper {
        background-color: #4ecdc4;
        color: white;
      }

      .scissors {
        background-color: #f7b731;
        color: white;
      }

      .btn:hover {
        transform: translateY(-5px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .reset-btn {
        background: #333;
        color: white;
        border: none;
        padding: 12px 25px;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
      }

      .reset-btn:hover {
        background: #000;
      }
    </style>
  </head>
  <body>
    <div class="game-container">
      <h1>🎮 Rock Paper Scissors</h1>

      <div class="buttons">
        <button class="btn rock" onclick="resulting('Rock')">✊ Rock</button>
        <button class="btn paper" onclick="resulting('Paper')">✋ Paper</button>
        <button class="btn scissors" onclick="resulting('Scissors')">
          ✌️ Scissors
        </button>
      </div>

      <button
        class="reset-btn"
        onclick="
          alert(
            `Win: ${(reSet.win = 0)} | Lose: ${(reSet.loose = 0)} | Tie: ${(reSet.Tie = 0)}`,
          )
        "
      >
        🔄 Reset Score
      </button>
    </div>
    <script>
      const reSet = {
        win: 0,
        loose: 0,
        Tie: 0,
      };
      function computerGuess() {
        const value = Math.random();
        let letter = "";
        if (value >= 0 && value < 1 / 3) {
          letter = "Rock";
        } else if (value >= 1 / 3 && value < 2 / 3) {
          letter = "Paper";
        } else if (value >= 2 / 3 && value < 1) {
          letter = "Scissors";
        }
        return letter;
      }

      function resulting(name) {
        let letter = computerGuess();
        let result = "";
        if (name === "Rock") {
          if (letter === "Rock") {
            result = "Tie";
          } else if (letter === "Paper") {
            result = "Loose";
          } else if (letter === "Scissors") {
            result = "Won";
          }
        } else if (name === "Paper") {
          if (letter === "Rock") {
            result = "Won";
          } else if (letter === "Paper") {
            result = "Tie";
          } else if (letter === "Scissors") {
            result = "Loose";
          }
        } else if (name === "Scissors") {
          if (letter === "Rock") {
            result = "Loose";
          } else if (letter === "Paper") {
            result = "Won";
          } else if (letter === "Scissors") {
            result = "Tie";
          }
        }
        if (result == "Won") {
          reSet.win += 1;
        } else if (result == "Loose") {
          reSet.loose += 1;
        } else if (result == "Tie") {
          reSet.Tie += 1;
        }
        alert(`You selected ${name} and computer selected ${letter} : You ${result}
won : ${reSet.win} loose : ${reSet.loose} Tie : ${reSet.Tie}`);
      }
    </script>
  </body>
</html>
