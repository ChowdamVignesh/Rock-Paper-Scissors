<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h1 {
        text-align: center;
        color: black;
        font-size: large;
      }
      .btn {
        box-sizing: border-box;
        margin: auto 10px;
        padding: 5px;
        background-color: aquamarine;
      }
      div {
        box-sizing: border-box;

        text-align: center;
        margin: auto 30px;
        padding: 20px;
      }
      section {
        box-sizing: border-box;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to Rock paper Scissors Game</h1>
    <div>
      <section>
        <button
          class="btn"
          onclick="
            let val1 = computerGuess();
            resulting('Rock', val1);
          "
        >
          Rock
        </button>
        <button
          class="btn"
          onclick="
            let val2 = computerGuess();
            resulting('Paper', val2);
          "
        >
          Paper
        </button>
        <button
          class="btn"
          onclick="
            let val3 = computerGuess();
            resulting('Scissors', val3);
          "
        >
          Scissors
        </button>
        <button
          onclick="
            alert(
              `win : ${(reSet.win = 0)} loose : ${(reSet.loose = 0)} Tie : ${(reSet.Tie = 0)}`,
            )
          "
        >
          Reset
        </button>
      </section>
    </div>
    <script>
      const reSet = {
        win: 0,
        loose: 0,
        Tie: 0,
      };
      function computerGuess() {
        const value = Math.random();
        let letter = "";
        if (value >= 0 && value < 1 / 3) {
          letter = "Rock";
        } else if (value >= 1 / 3 && value < 2 / 3) {
          letter = "Paper";
        } else if (value >= 2 / 3 && value < 1) {
          letter = "Scissors";
        }
        return letter;
      }

      function resulting(name, letter) {
        let result = "";
        if (name === "Rock") {
          if (letter === "Rock") {
            result = "Tie";
          } else if (letter === "Paper") {
            result = "Loose";
          } else if (letter === "Scissors") {
            result = "Won";
          }
        } else if (name === "Paper") {
          if (letter === "Rock") {
            result = "Won";
          } else if (letter === "Paper") {
            result = "Tie";
          } else if (letter === "Scissors") {
            result = "Loose";
          }
        } else if (name === "Scissors") {
          if (letter === "Rock") {
            result = "Loose";
          } else if (letter === "Paper") {
            result = "Won";
          } else if (letter === "Scissors") {
            result = "Tie";
          }
        }
        if (result == "Won") {
          reSet.win += 1;
        } else if (result == "Loose") {
          reSet.loose += 1;
        } else if (result == "Tie") {
          reSet.Tie += 1;
        }
        alert(`You selected ${name} and computer selected ${letter} : You ${result}
won : ${reSet.win} loose : ${reSet.loose} Tie : ${reSet.Tie}`);
      }
    </script>
  </body>
</html>
