<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h1 {
        text-align: center;
        color: black;
        font-size: large;
      }
      .btn {
        box-sizing: border-box;
        margin: auto 10px;
        padding: 5px;
        background-color: aquamarine;
      }
      div {
        box-sizing: border-box;
        text-align: center;
        margin: auto 30px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to Rock paper Scissors Game</h1>
    <div>
      <button
        class="btn"
        onclick="
          const value = Math.random();
          let letter = '';
          if (value >= 0 && value < 1 / 3) {
            letter = 'Rock';
          } else if (value >= 1 / 3 && value < 2 / 3) {
            letter = 'Paper';
          } else if (value >= 2 / 3 && value < 1) {
            letter = 'Scissors';
          }

          let result = '';
          if (letter === 'Rock') {
            result = 'Tie';
          } else if (letter === 'Paper') {
            result = 'loose';
          } else if (letter === 'Scissors') {
            result = 'Won';
          }

          alert(
            `You selected Rock and computer selected ${letter} : You ${result}`,
          );
        "
      >
        Rock
      </button>
      <button
        class="btn"
        onclick="
          const value = Math.random();
          let letter = '';
          if (value >= 0 && value < 1 / 3) {
            letter = 'Rock';
          } else if (value >= 1 / 3 && value < 2 / 3) {
            letter = 'Paper';
          } else if (value >= 2 / 3 && value < 1) {
            letter = 'Scissors';
          }

          let result = '';
          if (letter === 'Rock') {
            result = 'Won';
          } else if (letter === 'Paper') {
            result = 'Tie';
          } else if (letter === 'Scissors') {
            result = 'Loose';
          }

          alert(
            `You selected Paper and computer selected ${letter} : You ${result}`,
          );
        "
      >
        Paper
      </button>
      <button
        class="btn"
        onclick="
          const value = Math.random();
          let letter = '';
          if (value >= 0 && value < 1 / 3) {
            letter = 'Rock';
          } else if (value >= 1 / 3 && value < 2 / 3) {
            letter = 'Paper';
          } else if (value >= 2 / 3 && value < 1) {
            letter = 'Scissors';
          }

          let result = '';
          if (letter === 'Rock') {
            result = 'Loose';
          } else if (letter === 'Paper') {
            result = 'Won';
          } else if (letter === 'Scissors') {
            result = 'Tie';
          }

          alert(
            `You selected Scissors and computer selected ${letter} : You ${result}`,
          );
        "
      >
        Scissors
      </button>
    </div>
    <script></script>
  </body>
</html>
