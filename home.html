<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      h1 {
        text-align: center;
        color: black;
        font-size: large;
      }
      .btn {
        box-sizing: border-box;
        margin: auto 10px;
        padding: 5px;
        background-color: aquamarine;
      }
      div {
        box-sizing: border-box;
        text-align: center;
        margin: auto 30px;
        padding: 20px;
      }
    </style>
  </head>
  <body>
    <h1>Welcome to Rock paper Scissors Game</h1>
    <div>
      <button
        class="btn"
        onclick="
          const name1 = letter();
          const res1 = result(name1, 'Rock');
          alert(
            `You selected Rock and computer selected ${name1} : You ${res1}`,
          );
        "
      >
        Rock
      </button>
      <button
        class="btn"
        onclick="
          const name2 = letter();
          const res2 = result(name2, 'Paper');
          alert(
            `You selected Paper and computer selected ${name2} : You ${res2}`,
          );
        "
      >
        Paper
      </button>
      <button
        class="btn"
        onclick="
          const name3 = letter();
          const res3 = result(name3, 'Scissors');
          alert(
            `You selected Scissors and computer selected ${name3} : You ${res3}`,
          );
        "
      >
        Scissors
      </button>
    </div>
    <script>
      function letter() {
        const value = Math.random();
        let letter = "";
        if (value >= 0 && value < 1 / 3) {
          letter = "Rock";
        } else if (value >= 1 / 3 && value < 2 / 3) {
          letter = "Paper";
        } else if (value >= 2 / 3 && value < 1) {
          letter = "Scissors";
        }
        return letter;
      }

      function result(letter, name) {
        let result = "";
        if (name === "Rock") {
          if (letter === "Rock") {
            result = "Tie";
          } else if (letter === "Paper") {
            result = "Loose";
          } else {
            result = "Won";
          }
        } else if (name === "Paper") {
          if (letter === "Rock") {
            result = "Won";
          } else if (letter === "Paper") {
            result = "Tie";
          } else {
            result = "Loose";
          }
        } else if (name === "Scissors") {
          if (letter === "Rock") {
            result = "Loose";
          } else if (letter === "Paper") {
            result = "Won";
          } else {
            result = "Tie";
          }
        }
        return result;
      }
    </script>
  </body>
</html>
